        const payReceiptsList = ref([]);

        const payForm = reactive({
          payTime: dayjs().format('YYYY-MM-DD'),
          payMethod: 0, // 银行转账
          payRemark: ''
        });

        const payModalTitle = computed(() => {
          return isBatchPay.value
            ? `批量付款确认（共 ${payTargetBatch.value.length} 张单据）`
            : `确认标记付款 · ${payTargetSingle.value?.claimNo || ''}`;
        });

        const batchTotalAmount = computed(() => {
          return payTargetBatch.value.reduce((sum, item) => sum + Number(item.totalAmount || 0), 0);
        });

        // 单笔付款弹窗
        const openSinglePayModal = (record) => {
          isBatchPay.value = false;
          payTargetSingle.value = record;
          payForm.payTime = dayjs().format('YYYY-MM-DD');
          payForm.payMethod = 0;
          payForm.payRemark = '';
          payReceiptsList.value = [];
          payModalOpen.value = true;
        };

        // 批量付款弹窗
        const openBatchPayModal = () => {
          const selected = pendingList.value.filter(item => selectedRowKeys.value.includes(item.id));
          if (selected.length === 0) {
            antd.message.warning('请先勾选待付款的报销单');
            return;
          }
          isBatchPay.value = true;
          payTargetBatch.value = selected;
          payForm.payTime = dayjs().format('YYYY-MM-DD');
          payForm.payMethod = 0;
          payForm.payRemark = '';
          payReceiptsList.value = [];
          payModalOpen.value = true;
        };

        // 模拟电子回单上传
        const simulateFileUpload = () => {
          const fileNames = ['招商银行网银转账电子回单.png', '企业网银对公打款回单_PDF.png', '中国银行转账流水证明.jpg'];
          const randomName = fileNames[payReceiptsList.value.length % fileNames.length];
          payReceiptsList.value.push({
            name: randomName,
            size: `${(Math.random() * 200 + 45).toFixed(1)} KB`
          });
          antd.message.success(`已追加上传付款回单：${randomName}`);
        };

        // 确认标记付款执行
        const handleConfirmPay = () => {
          paySubmitting.value = true;
          setTimeout(() => {
            paySubmitting.value = false;
            payModalOpen.value = false;

            if (isBatchPay.value) {
              const ids = payTargetBatch.value.map(i => i.id);
              // 将选中的单据移入已付款
              payTargetBatch.value.forEach(item => {
                item.status = 4;
                item.payTime = payForm.payTime;
                item.payMethod = payForm.payMethod;
                item.payUserName = '超级管理员';
                item.payRemark = payForm.payRemark || '网银批量代发完成';
                paidList.value.unshift(item);
              });
              pendingList.value = pendingList.value.filter(item => !ids.includes(item.id));
              selectedRowKeys.value = [];
              antd.message.success(`已成功标记付款 ${ids.length} 张报销单，合计 ¥ ${batchTotalAmount.value.toFixed(2)} RMB`);
            } else {
              const target = payTargetSingle.value;
              target.status = 4;
              target.payTime = payForm.payTime;
              target.payMethod = payForm.payMethod;
              target.payUserName = '超级管理员';
              target.payRemark = payForm.payRemark || '网银转账支付完成';
              paidList.value.unshift(target);
              pendingList.value = pendingList.value.filter(item => item.id !== target.id);
              antd.message.success(`报销单 ${target.claimNo} 已成功标记付款`);
              if (detailDrawerOpen.value && activeDetail.value?.id === target.id) {
                activeDetail.value.status = 4;
                activeDetail.value.payTime = target.payTime;
                activeDetail.value.payUserName = target.payUserName;
                activeDetail.value.payMethod = target.payMethod;
                activeDetail.value.payRemark = target.payRemark;
              }
            }
          }, 500);
        };

        // 批量取消付款
        const handleBatchCancelPay = () => {
          const selected = paidList.value.filter(item => selectedRowKeys.value.includes(item.id));
          if (selected.length === 0) return;
          const total = selected.reduce((s, i) => s + Number(i.totalAmount), 0);

          antd.Modal.confirm({
            title: '批量取消付款确认',
            content: `预计取消 ${selected.length} 张单据，合计金额 ¥ ${total.toFixed(2)} RMB。取消后单据将重置回「待付款」状态。`,
            okText: '确认取消付款',
            okType: 'danger',
            cancelText: '放弃',
            onOk: () => {
              const ids = selected.map(i => i.id);
              selected.forEach(item => {
                item.status = 3;
                item.payTime = null;
                item.payMethod = null;
                item.payUserName = null;
                item.payRemark = null;
                pendingList.value.push(item);
              });
              paidList.value = paidList.value.filter(i => !ids.includes(i.id));
              selectedRowKeys.value = [];
              antd.message.success(`已取消付款 ${ids.length} 张单据，已退回待付款`);
            }
          });
        };

        // ==================== 审核后驳回弹窗 ====================
        const rejectModalOpen = ref(false);
        const rejectTarget = ref(null);
        const rejectRemark = ref('');

        const openRejectModal = (record) => {
          rejectTarget.value = record;
          rejectRemark.value = '';
          rejectModalOpen.value = true;
        };

        const handleConfirmReject = () => {
          if (!rejectRemark.value.trim()) {
            antd.message.warning('请填写驳回原因说明');
            return;
          }
          const target = rejectTarget.value;
          pendingList.value = pendingList.value.filter(i => i.id !== target.id);
          rejectModalOpen.value = false;
          if (detailDrawerOpen.value && activeDetail.value?.id === target.id) {
            detailDrawerOpen.value = false;
          }
          antd.message.success(`已驳回报销单 ${target.claimNo}，已退回申请人草稿箱`);
        };

        // ==================== 附件与凭证大图预览 ====================
        const previewModalOpen = ref(false);
        const previewAttachment = ref(null);

        const openAttachmentPreview = (attachment) => {
          previewAttachment.value = attachment;
          previewModalOpen.value = true;
        };

        // 辅助格式化函数
        const formatDateTime = (val) => {
          if (!val) return '-';
          return dayjs(val).format('YYYY-MM-DD HH:mm');
        };

        const formatDate = (val) => {
          if (!val) return '-';
          return dayjs(val).format('YYYY-MM-DD');
        };

        const formatBankAccount = (account) => {
          if (!account) return '-';
          return String(account).replace(/\s?/g, '').replace(/(\d{4})/g, '$1 ').trim();
        };

        const maskBankCard = (num) => {
          if (!num) return '-';
          const s = String(num);
          if (s.length <= 8) return s;
          return `${s.slice(0, 4)} **** **** ${s.slice(-4)}`;
        };

        const formatFileSize = (bytes) => {
          if (!bytes) return '7.3 KB';
          return `${(bytes / 1024).toFixed(1)} KB`;
        };

        const getPrimaryOrg = (record) => {
          if (record.orgs && record.orgs.length > 0) {
            return record.orgs[record.orgs.length - 1].name;
          }
          return '管理部';
        };

        const getOrgFullNames = (record) => {
          if (record.orgs && record.orgs.length > 0) {
            return record.orgs.map(o => o.name).join(' / ');
          }
          return '青岛佳越软件科技有限公司 / 管理部';
        };

        const getPayMethodLabel = (val) => {
          const map = { 0: '银行转账', 1: '现金', 2: '其他方式' };
          return map[val] || '银行转账';
        };

        const getInvoiceKindLabel = (kind) => {
          const map = {
            0: '增值税专用发票',
            1: '增值税普通发票',
            2: '火车票',
            3: '航空行程单',
            4: '客运汽车票',
            5: '出租车发票',
            6: '定额发票',
            9: '其他票据凭证'
          };
          return map[kind] || '普通发票';
        };

        const getCategoryLabel = (cat) => {
          const map = { 0: '通用', 1: '交通', 2: '住宿', 3: '招待', 4: '补贴' };
          return map[cat] || '通用';
        };

        const getItemIcon = (record) => {
          const cat = record.expenseType?.category;
          if (cat === 1) return 'lucide:car';
          if (cat === 2) return 'lucide:hotel';
          if (cat === 3) return 'lucide:utensils';
          if (cat === 4) return 'lucide:wallet';
          return 'lucide:file-text';
        };

        const getExtraText = (item) => {
          const cat = item.expenseType?.category;
          if (cat === 1) {
            return `${item.fromPlace || '始发'} → ${item.toPlace || '到达'}`;
          }
          if (cat === 2) {
            return `${item.city || ''} · ${item.nights || 1} 晚`;
          }
          if (cat === 3) {
            return `${item.guestCount || 1} 人 · ${item.guestDescription || '商务招待'}`;
          }
          if (cat === 4) {
            return `${item.allowanceDays || 1} 天 × ¥${item.allowanceStandard || 80}`;
          }
          return '';
        };

        const copyText = (txt, msg) => {
          if (!txt) return;
          navigator.clipboard.writeText(String(txt)).then(() => {
            antd.message.success(msg || '已复制到剪贴板');
          });
        };

        const paginationConfig = {
          pageSize: 20,
          showSizeChanger: true,
          showTotal: (total) => `共 ${total} 笔单据`
        };

        return {
          themeConfig,
          activeTab,
          filterExpanded,
          selectedRowKeys,
          queryForm,
          userFilterOptions,
          orgFilterOptions,
          pendingList,
          paidList,
          filteredList,
          currentColumns,
          selectedTotalAmount,
          onSelectChange,
          clearSelection,
          handleTabChange,
          handleSearch,
          handleReset,
          refreshList,
          customRowEvents,

          // 详情抽屉
          detailDrawerOpen,
          activeDetail,
          openDetailDrawer,
          drawerItemColumns,
          expandedDrawerItemKeys,
          toggleDrawerInvoices,

          // 付款弹窗
          payModalOpen,
          paySubmitting,
          isBatchPay,
          payTargetSingle,
          payTargetBatch,
          payReceiptsList,
          payForm,
          payModalTitle,
          batchTotalAmount,
          openSinglePayModal,
          openBatchPayModal,
          simulateFileUpload,
          handleConfirmPay,
          handleBatchCancelPay,

          // 驳回
          rejectModalOpen,
          rejectTarget,
          rejectRemark,
          openRejectModal,
          handleConfirmReject,

          // 预览
          previewModalOpen,
          previewAttachment,
          openAttachmentPreview,

          // 格式化函数
          formatDateTime,
          formatDate,
          formatBankAccount,
          maskBankCard,
          formatFileSize,
          getPrimaryOrg,
          getOrgFullNames,
          getPayMethodLabel,
          getInvoiceKindLabel,
          getCategoryLabel,
          getItemIcon,
          getExtraText,
          copyText,
          paginationConfig
        };
      }
    });

    app.use(antd).mount('#app');
  </script>
</body>
</html>
