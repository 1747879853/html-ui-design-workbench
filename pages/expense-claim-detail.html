<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>报销单详情 (BX202610180027) - 费用报销管理</title>

  <!-- 核心样式：Ant Design Vue 4 重置样式与通用规范 -->
  <link rel="stylesheet" href="../assets/vendor/reset.css">
  <link rel="stylesheet" href="../assets/css/common.css">

  <!-- 本地核心依赖 (全量包含 7 项 Dayjs 插件、Vue 3、Ant Design Vue 4.2.6、Iconify) -->
  <script src="../assets/vendor/dayjs-bundle.min.js"></script>
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/antd.min.js"></script>
  <script src="../assets/vendor/iconify-icon.min.js"></script>
  <script src="../assets/js/common.js"></script>

  <style>
    /* ==========================================================================
       企业级 B2B 报销单高保真优化：极致紧凑、严谨克制、去冗余、纯粹业务导向
       ========================================================================== */

    body {
      background-color: #f4f6f9;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      margin: 0;
      padding: 0;
    }

    .page-layout {
      min-height: 100vh;
      padding: 12px 16px 24px;
      box-sizing: border-box;
    }

    /* 顶部单号与主操作区 (已移除纯多余的面包屑路径、刷新按钮与字段核对报告) */
    .top-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .header-left-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .claim-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .claim-no-text {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .header-meta-text {
      font-size: 12px;
      color: #6b7280;
    }

    /* 首屏 3 项核心业务数据卡片 (彻底剔除重复驳回的第4卡片与AI竖条，无多余冗余) */
    .business-stat-row {
      display: grid;
      grid-template-columns: 280px 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .stat-body {
      min-width: 0;
      flex: 1;
    }

    .stat-title {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 2px;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-val.amount-highlight {
      font-size: 18px;
      color: #dc2626;
      font-variant-numeric: tabular-nums;
    }

    /* 主次双栏网格 (左主区 1fr : 侧栏 370px) */
    .main-grid-layout {
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 10px;
      align-items: start;
    }

    /* 标准卡片容器 */
    .content-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
    }

    .box-header-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 基本信息表单紧凑网格 (事由与备注左右 1:1 紧凑排布) */
    .form-row-4col {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 14px;
    }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    /* 费用明细表格 */
    .expense-table .ant-table-thead > tr > th {
      background: #f9fafb !important;
      color: #374151 !important;
      font-weight: 600 !important;
      font-size: 12px !important;
      padding: 8px 10px !important;
      border-bottom: 1px solid #e5e7eb !important;
    }

    .expense-table .ant-table-tbody > tr > td {
      padding: 8px 10px !important;
      font-size: 12px !important;
      border-bottom: 1px solid #f3f4f6 !important;
    }

    .expense-table .ant-table-tbody > tr:hover > td {
      background-color: #f9fafb !important;
    }

    /* 展开行内的发票子清单 */
    .expanded-invoice-wrap {
      background: #f9fafb;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
    }

    .expanded-invoice-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      font-size: 12px;
      color: #374151;
      border-bottom: 1px dashed #e5e7eb;
    }

    .expanded-invoice-item:last-child {
      border-bottom: none;
    }

    /* 审批流时间轴 */
    .timeline-wrap {
      padding: 4px 2px 2px;
    }

    .timeline-node-title {
      font-size: 12px;
      font-weight: 600;
      color: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-node-meta {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .timeline-remark-box {
      margin-top: 5px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      color: #374151;
      line-height: 1.4;
    }

    .timeline-remark-box.reject {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    /* 附件条目 */
    .attachment-card-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      margin-bottom: 6px;
      transition: all 0.2s ease;
    }

    .attachment-card-item:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .attachment-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 弹窗表单紧凑高保真优化：100% 对齐原系统字段、网格与发票子卡片 */
    .modal-form-item {
      margin-bottom: 8px !important;
    }

    .modal-form-item .ant-form-item-label {
      padding-bottom: 2px !important;
    }

    .modal-form-item .ant-form-item-label > label {
      font-size: 12px !important;
      color: #374151 !important;
      font-weight: 500;
    }

    .item-form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 12px;
    }

    .item-form-grid .col-span-2 {
      grid-column: span 2;
    }

    .item-form-grid .col-span-3 {
      grid-column: span 3;
    }

    .item-form-grid .col-span-4 {
      grid-column: span 4;
    }

    .field-subtext {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
      line-height: 1.25;
    }

    .readonly-text-val {
      display: inline-block;
      line-height: 32px;
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
    }

    .category-detail-box {
      margin-top: 6px;
      margin-bottom: 6px;
      padding: 8px 12px 2px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .category-detail-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .item-form-section-title {
      grid-column: span 4;
      font-size: 12px;
      font-weight: 600;
      color: #2563eb;
      margin-top: 4px;
      padding-bottom: 2px;
      border-bottom: 1px dashed #e5e7eb;
    }

    .item-form__section--bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 8px;
      margin-top: 6px;
      border-top: 1px solid #e5e7eb;
    }

    .empty-invoices-notice {
      text-align: center;
      padding: 16px 12px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 6px;
      font-size: 12px;
      color: #6b7280;
    }

    .modal-invoice-card {
      padding: 10px 12px 6px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #ffffff;
    }

    .modal-invoice-card__head {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f3f4f6;
    }

    .modal-invoice-card__file {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
    }

    .modal-invoice-card__summary {
      padding: 4px 0 6px;
      font-size: 12px;
      color: #374151;
    }

    .modal-invoice-card__grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 12px;
    }

    .modal-invoice-card__grid .col-span-2 {
      grid-column: span 2;
    }

    .modal-invoice-card__grid .col-span-4 {
      grid-column: span 4;
    }

    .modal-invoice-card__grid .ant-form-item {
      margin-bottom: 6px !important;
    }

    .ant-modal-body {
      max-height: calc(85vh - 110px);
      overflow-y: auto;
    }

    iconify-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: -0.15em;
    }
  </style>
</head>
<body>

  <!-- 原生无预解析模板 -->
  <script type="text/x-template" id="app-template">
    <a-config-provider :theme="themeConfig">
      <div class="page-layout">

        <!-- 1. 顶部操作栏 (已删减纯多余的路径、刷新按钮与字段报告，单号旁边保留唯一驳回状态) -->
        <div class="top-header-bar">
          <div class="header-left-info">
            <span class="claim-title-text">报销单</span>
            <span class="claim-no-text">{{ claim.claimNo }}</span>

            <a-tooltip :title="`驳回原因：${claim.auditRemark} (${claim.auditUserName})`">
              <a-tag :color="getStatusTagColor(claim.status)" style="margin: 0; font-weight: 500; cursor: pointer;">
                {{ statusLabel(claim.status) }}
              </a-tag>
            </a-tooltip>

            <a-tag v-if="isDirty" color="warning" style="margin: 0;">未保存修改</a-tag>

            <span class="header-meta-text">
              录入人：<b>{{ claim.creatorUserName }}</b> &nbsp;|&nbsp; 录入时间：{{ formatTime(claim.creationTime) }}
            </span>
          </div>

          <!-- 右侧动作按钮栏 (仅保留撤回、保存、重新提交) -->
          <a-space size="middle">
            <a-button v-if="canWithdraw" danger @click="handleWithdraw">
              <template #icon><iconify-icon icon="lucide:undo-2"></iconify-icon></template>
              撤回
            </a-button>

            <a-button @click="handleSave" :loading="saving">
              <template #icon><iconify-icon icon="lucide:save"></iconify-icon></template>
              保存修改
            </a-button>

            <a-button type="primary" :loading="submitting" @click="handleSaveAndSubmit">
              <template #icon><iconify-icon icon="lucide:send"></iconify-icon></template>
              重新提交审核
            </a-button>
          </a-space>
        </div>

        <!-- 2. 真实业务数据指标看板 (仅保留 3 个真实汇总卡片，彻底移除重复驳回的第4卡片与AI竖条) -->
        <div class="business-stat-row">
          <!-- 1. 报销总金额 -->
          <div class="stat-card">
            <div class="stat-icon" style="background: #fef2f2; color: #dc2626;">
              <iconify-icon icon="lucide:coins"></iconify-icon>
            </div>
            <div class="stat-body">
              <div class="stat-title">报销申请总金额 (本位币)</div>
              <div class="stat-val amount-highlight">
                ¥ {{ Number(claim.totalAmount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
                <span style="font-size: 11px; color: #9ca3af; font-weight: 400;">RMB</span>
              </div>
            </div>
          </div>

          <!-- 2. 报销人与组织 -->
          <div class="stat-card">
            <div class="stat-icon" style="background: #eff6ff; color: #2563eb;">
              <iconify-icon icon="lucide:user-check"></iconify-icon>
            </div>
            <div class="stat-body">
              <div class="stat-title">报销人与归属组织</div>
              <div class="stat-val" style="font-size: 13px;">
                <span>{{ claim.user.nickName }}</span>
                <a-tag color="blue" size="small" bordered="false">{{ currentOrgName }}</a-tag>
              </div>
            </div>
          </div>

          <!-- 3. 收款银行与账号 -->
          <div class="stat-card">
            <div class="stat-icon" style="background: #ecfdf5; color: #059669;">
              <iconify-icon icon="lucide:credit-card"></iconify-icon>
            </div>
            <div class="stat-body">
              <div class="stat-title">指定收款银行与账号</div>
              <div class="stat-val" style="font-size: 13px;" :title="claim.payeeBankAccount">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                  {{ claim.payeeBankName }} ({{ maskBankCard(claim.payeeBankAccount) }})
                </span>
                <iconify-icon
                  icon="lucide:copy"
                  style="cursor: pointer; color: #9ca3af; font-size: 13px; margin-left: 4px;"
                  @click="copyText(claim.payeeBankAccount, '收款账号已复制')"
                  title="复制账号"
                ></iconify-icon>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. 主副双栏布局 (主业务区 1fr : 侧栏 370px) -->
        <div class="main-grid-layout">

          <!-- 左侧主体：基本信息表单 + 费用明细表格 -->
          <div>

            <!-- A. 基本信息卡片 -->
            <div class="content-box">
              <div class="box-header">
                <div class="box-header-title">
                  <iconify-icon icon="lucide:file-text" style="color: #2563eb;"></iconify-icon>
                  <span>一、报销基本信息</span>
                </div>
                <a-tag color="processing" bordered="false">日常报销流程</a-tag>
              </div>

              <a-form layout="vertical" :model="claim">
                <div class="form-row-4col">
                  <a-form-item label="报销申请人" tooltip="默认本人；替他人填报需有代填权限" style="margin-bottom: 0;">
                    <a-select v-model:value="claim.userId" :options="userOptions" style="width: 100%;" @change="isDirty = true" />
                  </a-form-item>

                  <a-form-item label="归属业务组织" tooltip="从进项发票选票前请先确定" style="margin-bottom: 0;">
                    <a-select v-model:value="claim.orgId" :options="orgOptions" style="width: 100%;" @change="isDirty = true" />
                  </a-form-item>

                  <a-form-item label="单据类型" required style="margin-bottom: 0;">
                    <a-radio-group v-model:value="claim.claimType" button-style="solid" style="width: 100%;" @change="isDirty = true">
                      <a-radio-button :value="0" style="width: 50%; text-align: center;">日常报销</a-radio-button>
                      <a-radio-button :value="1" style="width: 50%; text-align: center;">差旅报销</a-radio-button>
                    </a-radio-group>
                  </a-form-item>

                  <a-form-item label="收款银行账户" required tooltip="打款原路入账" style="margin-bottom: 0;">
                    <a-select v-model:value="claim.userBankAccountId" :options="bankAccountOptions" style="width: 100%;" @change="isDirty = true" />
                  </a-form-item>
                </div>

                <!-- 差旅专项字段 (选择差旅报销时展开) -->
                <div v-if="claim.claimType === 1" class="form-row-4col" style="margin-top: 10px;">
                  <a-form-item label="出差地点" required style="margin-bottom: 0;">
                    <a-input v-model:value="claim.tripPlace" placeholder="如：广东深圳" @change="isDirty = true" />
                  </a-form-item>
                  <a-form-item label="出差开始日期" required style="margin-bottom: 0;">
                    <a-date-picker v-model:value="claim.tripStartDate" value-format="YYYY-MM-DD" style="width: 100%;" @change="isDirty = true" />
                  </a-form-item>
                  <a-form-item label="出差结束日期" required style="margin-bottom: 0;">
                    <a-date-picker v-model:value="claim.tripEndDate" value-format="YYYY-MM-DD" style="width: 100%;" @change="isDirty = true" />
                  </a-form-item>
                </div>

                <!-- 事由与备注左右 1:1 紧凑排布 -->
                <div class="form-row-2col">
                  <a-form-item label="报销核心事由" required style="margin-bottom: 0;">
                    <a-textarea
                      v-model:value="claim.reason"
                      placeholder="请输入报销核心事由说明..."
                      :rows="2"
                      :maxlength="1024"
                      show-count
                      @change="isDirty = true"
                    />
                  </a-form-item>

                  <a-form-item label="补充备注与经办说明" style="margin-bottom: 0;">
                    <a-textarea
                      v-model:value="claim.remark"
                      placeholder="选填补充说明、特批说明或特殊财务指引..."
                      :rows="2"
                      :maxlength="1024"
                      @change="isDirty = true"
                    />
                  </a-form-item>
                </div>

                <!-- 终审与历史事实快照存根 (折叠收拢) -->
                <a-collapse :bordered="false" style="background: #f9fafb; border-radius: 4px; margin-top: 10px;">
                  <a-collapse-panel key="facts" header="查看历史打款事实与终审快照存根 (收款快照、终审信息)">
                    <a-descriptions size="small" bordered :column="3">
                      <a-descriptions-item label="提交时间">{{ formatTime(claim.submitTime) }}</a-descriptions-item>
                      <a-descriptions-item label="终审责任人">{{ claim.auditUserName || '-' }}</a-descriptions-item>
                      <a-descriptions-item label="终审归档时间">{{ formatTime(claim.auditTime) }}</a-descriptions-item>
                      <a-descriptions-item label="驳回批注" :span="3">
                        <span style="color: #dc2626; font-weight: 600;">{{ claim.auditRemark || '-' }}</span>
                      </a-descriptions-item>
                      <a-descriptions-item label="收款存根快照" :span="3">
                        {{ claim.payeeAccountName }} · {{ claim.payeeBankName }} · {{ claim.payeeBankAccount }}
                      </a-descriptions-item>
                    </a-descriptions>
                  </a-collapse-panel>
                </a-collapse>
              </a-form>
            </div>

            <!-- B. 费用明细表格卡片 -->
            <div class="content-box">
              <div class="box-header">
                <div class="box-header-title">
                  <iconify-icon icon="lucide:receipt" style="color: #059669;"></iconify-icon>
                  <span>二、报销费用明细列表</span>
                  <a-tag color="cyan" bordered="false">共 {{ claim.items.length }} 笔明细</a-tag>
                  <a-tag v-if="selectedRowKeys.length > 0" color="blue" bordered="false">已选 {{ selectedRowKeys.length }} 项</a-tag>
                </div>

                <!-- 顶部统一集成操作工具栏 (彻底消除操作列重复按钮，统一由顶部操作) -->
                <a-space size="small">
                  <a-button type="primary" size="small" @click="openItemModal(null)">
                    <template #icon><iconify-icon icon="lucide:plus"></iconify-icon></template>
                    添加费用行
                  </a-button>

                  <a-button size="small" :disabled="selectedRowKeys.length !== 1" @click="editSelectedRow">
                    <template #icon><iconify-icon icon="lucide:edit-3"></iconify-icon></template>
                    编辑明细
                  </a-button>

                  <a-button size="small" :disabled="!canMoveUp" @click="moveSelectedRow(-1)">
                    <template #icon><iconify-icon icon="lucide:arrow-up"></iconify-icon></template>
                    上移
                  </a-button>

                  <a-button size="small" :disabled="!canMoveDown" @click="moveSelectedRow(1)">
                    <template #icon><iconify-icon icon="lucide:arrow-down"></iconify-icon></template>
                    下移
                  </a-button>

                  <a-popconfirm
                    :title="`确定删除选中的 ${selectedRowKeys.length} 笔明细行吗？`"
                    :disabled="selectedRowKeys.length === 0"
                    ok-text="删除"
                    cancel-text="取消"
                    @confirm="deleteSelectedRows"
                  >
                    <a-button danger size="small" :disabled="selectedRowKeys.length === 0">
                      <template #icon><iconify-icon icon="lucide:trash-2"></iconify-icon></template>
                      删除
                    </a-button>
                  </a-popconfirm>
                </a-space>
              </div>

              <!-- 明细数据表格 -->
              <a-table
                class="expense-table"
                :columns="itemColumns"
                :data-source="claim.items"
                :pagination="false"
                bordered
                size="small"
                row-key="id"
                :row-selection="rowSelection"
                :custom-row="customRow"
                :scroll="{ x: 1200 }"
                :expanded-row-keys="expandedItemKeys"
                :show-expand-column="false"
              >
                <!-- 自定义单元格插槽 -->
                <template #bodyCell="{ column, record, index }">
                  
                  <!-- 序号 -->
                  <template v-if="column.key === 'index'">
                    <span style="color: #9ca3af; font-weight: 600;">{{ index + 1 }}</span>
                  </template>

                  <!-- 报销类型 -->
                  <template v-else-if="column.key === 'type'">
                    <div style="display: flex; align-items: center; gap: 6px;">
                      <iconify-icon :icon="getItemIcon(record)" style="color: #4b5563; font-size: 14px;"></iconify-icon>
                      <span style="font-weight: 500;">{{ record.expenseType?.name }}</span>
                    </div>
                    <div style="font-size: 11px; color: #9ca3af; margin-top: 1px;">
                      编码：{{ record.expenseType?.code }}
                    </div>
                  </template>

                  <!-- 发生日期 -->
                  <template v-else-if="column.key === 'occurDate'">
                    <span style="font-family: monospace; color: #4b5563;">{{ formatDate(record.occurDate) }}</span>
                  </template>

                  <!-- 原币金额 -->
                  <template v-else-if="column.key === 'amount'">
                    <span style="font-weight: 600; font-variant-numeric: tabular-nums;">
                      {{ Number(record.amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
                    </span>
                    <span style="font-size: 11px; color: #9ca3af; margin-left: 3px;">{{ record.currency?.code }}</span>
                  </template>

                  <!-- 汇率 -->
                  <template v-else-if="column.key === 'rate'">
                    <span style="font-family: monospace; color: #6b7280;">{{ Number(record.rate).toFixed(4) }}</span>
                  </template>

                  <!-- 本位币金额 -->
                  <template v-else-if="column.key === 'localAmount'">
                    <span style="font-weight: 700; color: #dc2626; font-size: 13px; font-variant-numeric: tabular-nums;">
                      ¥ {{ Number(record.localAmount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
                    </span>
                  </template>

                  <!-- 发票 -->
                  <template v-else-if="column.key === 'invoices'">
                    <template v-if="record.invoices && record.invoices.length > 0">
                      <a-button
                        type="link"
                        size="small"
                        style="padding: 0; font-size: 12px;"
                        @click.stop="toggleInvoices(record)"
                      >
                        <iconify-icon :icon="isExpanded(record) ? 'lucide:chevron-up' : 'lucide:file-check'" style="margin-right: 3px;"></iconify-icon>
                        发票 {{ record.invoices.length }} 张 · {{ isExpanded(record) ? '收起' : '查看' }}
                      </a-button>
                    </template>
                    <template v-else>
                      <a-tooltip :title="record.noInvoiceReason ? `无票说明：${record.noInvoiceReason}` : '未附带发票凭证'">
                        <span style="color: #d97706; font-size: 12px; cursor: pointer;">
                          <iconify-icon icon="lucide:alert-circle" style="margin-right: 2px;"></iconify-icon>
                          无发票
                        </span>
                      </a-tooltip>
                    </template>
                  </template>

                  <!-- 明细 -->
                  <template v-else-if="column.key === 'extra'">
                    <span style="font-size: 12px; color: #4b5563;">{{ record.extra || '-' }}</span>
                  </template>

                  <!-- 说明 / 无票说明 -->
                  <template v-else-if="column.key === 'description'">
                    <div v-if="record.description" class="text-ellipsis" style="max-width: 220px;" :title="record.description">
                      {{ record.description }}
                    </div>
                    <div v-if="record.noInvoiceReason" style="font-size: 11px; color: #d97706;" class="text-ellipsis" :title="record.noInvoiceReason">
                      无票：{{ record.noInvoiceReason }}
                    </div>
                    <span v-if="!record.description && !record.noInvoiceReason" style="color: #9ca3af;">-</span>
                  </template>

                  <!-- 关联业务单 -->
                  <template v-else-if="column.key === 'link'">
                    <span v-if="record.transportOrder" style="font-size: 12px; color: #2563eb; font-family: monospace;">
                      {{ record.transportOrder }}
                    </span>
                    <span v-else style="color: #9ca3af;">-</span>
                  </template>
                </template>

                <!-- 真实发票展开行 -->
                <template #expandedRowRender="{ record }">
                  <div class="expanded-invoice-wrap">
                    <div style="font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 6px;">
                      附带发票凭证清单 ({{ record.invoices.length }} 张)：
                    </div>
                    <div v-for="(inv, invIdx) in record.invoices" :key="inv.key" class="expanded-invoice-item">
                      <span style="color: #9ca3af; font-weight: 600;">{{ invIdx + 1 }}.</span>
                      <a-tag :color="inv.source === 1 ? 'blue' : 'green'" size="small">
                        {{ inv.source === 1 ? '手工录入' : '进项采集' }}
                      </a-tag>
                      <span style="font-weight: 500;">{{ getInvoiceKindLabel(inv.invoiceKind) }}</span>
                      <span style="font-family: monospace;">代码/号码：{{ inv.invoiceCode ? `${inv.invoiceCode} / ` : '' }}{{ inv.invoiceNo || '-' }}</span>
                      <span style="color: #6b7280;">开票日期：{{ inv.invoiceDate }}</span>
                      <span style="color: #4b5563; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        销方：{{ inv.sellerHeader || '-' }}
                      </span>
                      <span style="font-weight: 700; color: #dc2626; margin-left: auto;">
                        ¥ {{ Number(inv.amount).toFixed(2) }}
                      </span>
                      <a-button type="link" size="small" style="padding: 0;" @click="antd.message.info(`查看发票附件：${inv.invoiceNo}`)">
                        查看附件
                      </a-button>
                    </div>
                  </div>
                </template>

                <!-- 表格底部合计行 -->
                <template #summary>
                  <a-table-summary fixed>
                    <a-table-summary-row style="background: #f9fafb; font-weight: 600;">
                      <a-table-summary-cell :index="0" :col-span="5" style="text-align: right; color: #4b5563;">
                        合计预估金额：
                      </a-table-summary-cell>
                      <a-table-summary-cell :index="1" style="text-align: right; color: #dc2626; font-size: 14px;">
                        ¥ {{ Number(claim.totalAmount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
                      </a-table-summary-cell>
                      <a-table-summary-cell :index="2" :col-span="5">
                        <span style="font-weight: 400; font-size: 12px; color: #9ca3af;">（结算本位币：RMB 人民币）</span>
                      </a-table-summary-cell>
                    </a-table-summary-row>
                  </a-table-summary>
                </template>
              </a-table>
            </div>
          </div>

          <!-- 右侧边栏：多轮次审批历程 + 凭证单据 + 付款回单 (370px 宽度) -->
          <div>
            <!-- A. 审批流程 (历次轮次追踪，此处为审批流主载体) -->
            <div class="content-box">
              <div class="box-header">
                <div class="box-header-title">
                  <iconify-icon icon="lucide:git-pull-request" style="color: #2563eb;"></iconify-icon>
                  <span>审批流程 (历次轮次)</span>
                </div>
              </div>

              <!-- 3 轮流转历史 Tab 切换 -->
              <a-tabs v-model:activeKey="activeRoundTab" size="small" type="card">
                <a-tab-pane
                  v-for="item in auditHistory"
                  :key="item.round"
                  :tab="`第 ${item.round} 轮${item.isCurrent ? ' (最新)' : ''}`"
                >
                  <div class="timeline-wrap">
                    <!-- 轮次审核结果与批注 (仅在审批流时间轴内呈现，不全屏重复) -->
                    <div v-if="item.taskStatus === 1" class="timeline-remark-box reject" style="margin-bottom: 10px;">
                      <div style="font-weight: 600; display: flex; align-items: center; gap: 6px;">
                        <iconify-icon icon="lucide:x-circle" style="color: #dc2626;"></iconify-icon>
                        <span>第 {{ item.round }} 轮审核结果：已驳回</span>
                      </div>
                      <div style="margin-top: 4px;">批注：{{ item.remark }}</div>
                    </div>

                    <a-timeline>
                      <!-- 提交节点 -->
                      <a-timeline-item color="blue">
                        <template #dot><iconify-icon icon="lucide:send" style="font-size: 12px; color: #2563eb;"></iconify-icon></template>
                        <div class="timeline-node-title">
                          <span>提交申请</span>
                          <a-tag size="small" color="blue">已提交</a-tag>
                        </div>
                        <div class="timeline-node-meta">
                          {{ item.submitUserName }} · {{ formatTime(item.submitTime) }}
                        </div>
                      </a-timeline-item>

                      <!-- 各级审核节点 -->
                      <template v-if="item.workFlowInstance && item.workFlowInstance.levelGroup">
                        <a-timeline-item
                          v-for="grp in item.workFlowInstance.levelGroup"
                          :key="grp.level"
                          :color="grp.itemList[0]?.taskStatus === 2 ? 'green' : (grp.itemList[0]?.taskStatus === 1 ? 'red' : 'gray')"
                        >
                          <template #dot>
                            <iconify-icon
                              :icon="grp.itemList[0]?.taskStatus === 2 ? 'lucide:check-circle-2' : (grp.itemList[0]?.taskStatus === 1 ? 'lucide:x-circle' : 'lucide:clock')"
                              :style="{ fontSize: '13px', color: grp.itemList[0]?.taskStatus === 2 ? '#10b981' : (grp.itemList[0]?.taskStatus === 1 ? '#dc2626' : '#9ca3af') }"
                            ></iconify-icon>
                          </template>
                          <div class="timeline-node-title">
                            <span>第 {{ grp.level }} 级审核 ({{ grp.level === 1 ? '主管审核' : '财务终审' }})</span>
                            <a-tag :color="grp.itemList[0]?.taskStatus === 2 ? 'success' : (grp.itemList[0]?.taskStatus === 1 ? 'error' : 'default')" size="small">
                              {{ grp.itemList[0]?.taskStatus === 2 ? '通过' : (grp.itemList[0]?.taskStatus === 1 ? '驳回' : '等待') }}
                            </a-tag>
                          </div>
                          <div class="timeline-node-meta">
                            {{ grp.itemList[0]?.userNickName }} · {{ formatTime(grp.itemList[0]?.auditTime) }}
                          </div>
                          <div v-if="grp.itemList[0]?.comment" class="timeline-remark-box">
                            {{ grp.itemList[0]?.comment }}
                          </div>
                        </a-timeline-item>
                      </template>
                    </a-timeline>
                  </div>
                </a-tab-pane>
              </a-tabs>
            </div>

            <!-- B. 单据附件卡片 -->
            <div class="content-box">
              <div class="box-header">
                <div class="box-header-title">
                  <iconify-icon icon="lucide:paperclip" style="color: #7c3aed;"></iconify-icon>
                  <span>单据凭证附件 ({{ claim.attachments.length }})</span>
                </div>
                <a-button type="link" size="small" style="padding: 0;" @click="uploadAttachment">
                  <template #icon><iconify-icon icon="lucide:plus"></iconify-icon></template>
                  上传文件
                </a-button>
              </div>

              <div v-if="claim.attachments.length === 0" style="text-align: center; padding: 14px 0; color: #9ca3af; font-size: 12px;">
                <iconify-icon icon="lucide:paperclip" style="font-size: 24px; color: #d1d5db; margin-bottom: 2px;"></iconify-icon>
                <div>暂无单据附件，可点击右上角上传</div>
              </div>

              <div v-for="(att, attIdx) in claim.attachments" :key="att.attachmentId" class="attachment-card-item">
                <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
                  <iconify-icon icon="lucide:file-text" style="color: #ef4444; font-size: 15px; flex-shrink: 0;"></iconify-icon>
                  <span class="text-ellipsis" style="font-size: 12px; color: #374151;" :title="att.fileName">{{ att.fileName }}</span>
                </div>
                <div class="attachment-actions">
                  <a-button type="link" size="small" style="padding: 0 4px; font-size: 12px;" @click="antd.message.success('已下载凭证附件: ' + att.fileName)">预览</a-button>
                  <a-divider type="vertical" style="margin: 0 2px;" />
                  <a-popconfirm title="确定删除此单据附件吗？" ok-text="删除" cancel-text="取消" @confirm="deleteAttachment(attIdx)">
                    <a-button type="link" danger size="small" style="padding: 0 4px; font-size: 12px;">删除</a-button>
                  </a-popconfirm>
                </div>
              </div>
            </div>

            <!-- C. 财务付款回单 -->
            <div class="content-box">
              <div class="box-header">
                <div class="box-header-title">
                  <iconify-icon icon="lucide:file-check-2" style="color: #16a34a;"></iconify-icon>
                  <span>付款回单 ({{ claim.payReceipts.length }})</span>
                </div>
              </div>

              <div style="text-align: center; padding: 14px 0; color: #9ca3af; font-size: 12px;">
                <iconify-icon icon="lucide:inbox" style="font-size: 26px; color: #d1d5db; margin-bottom: 3px;"></iconify-icon>
                <div>尚未完成财务打款，暂无银行付款回单</div>
              </div>
            </div>

          </div>
        </div>

        <!-- 4. 编辑/新建费用明细弹窗 (100% 对齐原系统字段：类型、日期、币别、申报金额、关联客户、关联业务、本位币、说明、发票清单及子卡片) -->
        <a-modal
          v-model:open="itemModalVisible"
          :title="editingItem.id ? '编辑报销明细' : '添加报销明细'"
          width="900px"
          :destroy-on-close="true"
        >
          <a-form layout="vertical" :model="editingItem" style="padding-top: 4px;">
            
            <!-- 基础要素区：Row 1 (报销类型、发生日期、币别、申报金额) + Row 2 (关联客户、关联业务、汇率[外币时]、本位币金额) -->
            <div class="item-form-grid">
              <a-form-item label="报销类型" required class="modal-form-item">
                <a-select
                  v-model:value="editingItem.expenseTypeId"
                  :options="expenseTypeOptions"
                  placeholder="请选择报销类型"
                  show-search
                  option-filter-prop="label"
                  @change="onExpenseTypeChange"
                />
              </a-form-item>

              <a-form-item label="发生日期" required class="modal-form-item">
                <a-date-picker
                  v-model:value="editingItem.occurDate"
                  value-format="YYYY-MM-DD"
                  placeholder="请选择日期"
                  style="width: 100%;"
                />
              </a-form-item>

              <a-form-item label="币别" class="modal-form-item">
                <a-select
                  v-model:value="editingItem.currencyId"
                  :options="currencySelectOptions"
                  allow-clear
                  placeholder="本位币（RMB）"
                  @change="onCurrencyChange"
                />
                <div class="field-subtext">不选为本位币</div>
              </a-form-item>

              <a-form-item label="申报金额" required class="modal-form-item">
                <a-input-number
                  v-model:value="editingItem.amount"
                  :min="0"
                  :precision="2"
                  style="width: 100%;"
                  placeholder="0.00"
                  @change="recomputeAmounts"
                />
              </a-form-item>

              <!-- Row 2 Col 1: 关联客户 -->
              <a-form-item label="关联客户" class="modal-form-item">
                <a-select
                  v-model:value="editingItem.clientId"
                  :options="clientOptions"
                  allow-clear
                  placeholder="可选"
                />
              </a-form-item>

              <!-- Row 2 Col 2: 关联业务 (本位币时占2列，外币时占1列给汇率腾位) -->
              <a-form-item
                label="关联业务"
                :class="['modal-form-item', (!editingItem.currencyId || editingItem.currencyId === 1) ? 'col-span-2' : '']"
              >
                <div style="display: flex; gap: 6px;">
                  <a-select
                    v-model:value="editingItem.transportOrderBizType"
                    :options="businessTypeOptions"
                    :style="{ width: (!editingItem.currencyId || editingItem.currencyId === 1) ? '120px' : '98px', flexShrink: 0 }"
                  />
                  <a-select
                    v-model:value="editingItem.transportOrderId"
                    :options="businessOrderOptions"
                    show-search
                    allow-clear
                    placeholder="先选类型再搜单号"
                    style="flex: 1; min-width: 0;"
                  />
                </div>
                <div class="field-subtext">先选类型再搜委托编号/主单号</div>
              </a-form-item>

              <!-- Row 2 Col 3: 汇率 (仅外币时显示在第3列，与上方币别对齐，紧邻本位币金额) -->
              <a-form-item
                v-if="editingItem.currencyId && editingItem.currencyId !== 1"
                label="汇率"
                class="modal-form-item"
              >
                <a-input-number
                  v-model:value="editingItem.rate"
                  :min="0"
                  :precision="4"
                  style="width: 100%;"
                  placeholder="自动取应付汇率"
                  @change="recomputeAmounts"
                />
                <div class="field-subtext">不填按发生日取应付汇率</div>
              </a-form-item>

              <!-- Row 2 Col 4: 本位币金额 (与上方申报金额对齐，外币时与汇率紧密并排) -->
              <a-form-item label="本位币金额" class="modal-form-item">
                <a-input
                  :value="editingItem.localAmount !== null && editingItem.localAmount !== undefined ? '¥ ' + Number(editingItem.localAmount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '¥ 0.00'"
                  disabled
                  style="color: #111827; font-weight: 600; background: #f9fafb; border-color: #d9d9d9; text-align: right; font-variant-numeric: tabular-nums;"
                />
                <div class="field-subtext">预估，保存时可能按汇率重算</div>
              </a-form-item>
            </div>

            <!-- 分类专属明细区：位于基础要素下方独立承载，避免打断核心要素排布 -->
            <template v-if="currentExpenseCategory === 'transport'">
              <div class="category-detail-box">
                <div class="category-detail-title">
                  <iconify-icon icon="lucide:plane" style="color: #2563eb;"></iconify-icon>
                  <span>交通信息</span>
                </div>
                <div class="item-form-grid">
                  <a-form-item label="出发地" required class="modal-form-item">
                    <a-input v-model:value="editingItem.fromPlace" placeholder="如：上海虹桥" />
                  </a-form-item>
                  <a-form-item label="目的地" required class="modal-form-item">
                    <a-input v-model:value="editingItem.toPlace" placeholder="如：深圳宝安" />
                  </a-form-item>
                  <a-form-item label="交通工具" required class="modal-form-item">
                    <a-select v-model:value="editingItem.vehicle" :options="vehicleOptions" placeholder="请选择" />
                  </a-form-item>
                </div>
              </div>
            </template>

            <template v-else-if="currentExpenseCategory === 'hotel'">
              <div class="category-detail-box">
                <div class="category-detail-title">
                  <iconify-icon icon="lucide:hotel" style="color: #2563eb;"></iconify-icon>
                  <span>住宿信息</span>
                </div>
                <div class="item-form-grid">
                  <a-form-item label="城市" required class="modal-form-item">
                    <a-input v-model:value="editingItem.city" placeholder="如：广东深圳" />
                  </a-form-item>
                  <a-form-item label="入住日期" required class="modal-form-item">
                    <a-date-picker v-model:value="editingItem.checkInDate" value-format="YYYY-MM-DD" style="width: 100%;" />
                  </a-form-item>
                  <a-form-item label="离店日期" required class="modal-form-item">
                    <a-date-picker v-model:value="editingItem.checkOutDate" value-format="YYYY-MM-DD" style="width: 100%;" />
                  </a-form-item>
                  <a-form-item label="晚数" class="modal-form-item">
                    <span class="readonly-text-val">{{ hotelNightsPreview }} 晚</span>
                    <div class="field-subtext">预估，以保存结果为准</div>
                  </a-form-item>
                </div>
              </div>
            </template>

            <template v-else-if="currentExpenseCategory === 'entertainment'">
              <div class="category-detail-box">
                <div class="category-detail-title">
                  <iconify-icon icon="lucide:coffee" style="color: #2563eb;"></iconify-icon>
                  <span>餐饮招待信息</span>
                </div>
                <div class="item-form-grid">
                  <a-form-item label="招待人数" required class="modal-form-item">
                    <a-input-number v-model:value="editingItem.guestCount" :min="1" style="width: 100%;" />
                  </a-form-item>
                  <a-form-item label="招待对象" required class="modal-form-item col-span-3">
                    <a-input v-model:value="editingItem.guestDescription" placeholder="未关联客户时必填，如：招商局港口现场商务代表" />
                  </a-form-item>
                </div>
              </div>
            </template>

            <template v-else-if="currentExpenseCategory === 'allowance'">
              <div class="category-detail-box">
                <div class="category-detail-title">
                  <iconify-icon icon="lucide:badge-dollar-sign" style="color: #2563eb;"></iconify-icon>
                  <span>差旅补贴信息</span>
                </div>
                <div class="item-form-grid">
                  <a-form-item label="天数" required class="modal-form-item">
                    <a-input-number v-model:value="editingItem.allowanceDays" :min="0.5" :step="0.5" style="width: 100%;" @change="recomputeAllowance" />
                    <div class="field-subtext">大于 0，最多 1 位小数</div>
                  </a-form-item>
                  <a-form-item label="标准（每天）" required class="modal-form-item">
                    <a-input-number v-model:value="editingItem.allowanceStandard" :min="0" :precision="2" style="width: 100%;" @change="recomputeAllowance" />
                  </a-form-item>
                  <a-form-item label="补贴金额" class="modal-form-item col-span-2">
                    <span class="readonly-text-val">¥ {{ Number(editingItem.amount || 0).toFixed(2) }}</span>

          { label: '差旅综合出差补贴 (日常费用)', value: 'EXP-ALLOWANCE-01' },
          { label: 'WF332验收通用 (日常费用)', value: '1c44e4e0-aa64-44b4-9892-7611c73dc9a7' },
          { label: '海外离岸技术服务费', value: 'EXP-OVERSEAS-01' }
        ];

        const currencyOptions = [
          { label: 'RMB (人民币)', value: 1 },
          { label: 'USD (美元)', value: 2 }
        ];

        const currencySelectOptions = [
          { label: '本位币（RMB）', value: 1 },
          { label: 'USD (美元)', value: 2 },
          { label: 'EUR (欧元)', value: 3 },
          { label: 'HKD (港币)', value: 4 }
        ];

        const invoiceKindOptions = [
          { label: '增值税专用发票', value: 0 },
          { label: '增值税普通发票', value: 1 },
          { label: '增值税电子普通发票', value: 2 },
          { label: '航空运输电子客票行程单', value: 3 },
          { label: '铁路电子客票', value: 4 },
          { label: '网约车行程单/电子发票', value: 5 },
          { label: '其他客票/境外发票', value: 99 }
        ];

        const vehicleOptions = [
          { label: '飞机', value: '飞机' },
          { label: '火车 / 高铁', value: '火车' },
          { label: '出租车 / 网约车', value: '出租车' },
          { label: '轮船 / 客船', value: '轮船' },
          { label: '公共汽车 / 地铁', value: '公交' },
          { label: '自驾车', value: '自驾' },
          { label: '其他', value: '其他' }
        ];

        const currentExpenseCategory = computed(() => {
          const typeId = editingItem.expenseTypeId;
          if (!typeId) return 'general';
          if (typeId === 'EXP-AIR-01' || typeId === 'EXP-TAXI-01' || String(typeId).includes('TRAFFIC')) return 'transport';
          if (typeId === 'EXP-HOTEL-01' || String(typeId).includes('HOTEL')) return 'hotel';
          if (String(typeId).includes('ENTERTAIN')) return 'entertainment';
          if (String(typeId).includes('ALLOWANCE')) return 'allowance';
          return 'general';
        });

        const hotelNightsPreview = computed(() => {
          if (!editingItem.checkInDate || !editingItem.checkOutDate) return 1;
          const d1 = window.dayjs(editingItem.checkInDate);
          const d2 = window.dayjs(editingItem.checkOutDate);
          const diff = d2.diff(d1, 'day');
          return diff > 0 ? diff : 1;
        });

        const recomputeAmounts = () => {
          const rate = Number(editingItem.rate || 1.0);
          const amt = Number(editingItem.amount || 0);
          editingItem.localAmount = amt ? Number((amt * rate).toFixed(2)) : null;
        };

        const recomputeAllowance = () => {
          const days = Number(editingItem.allowanceDays || 0);
          const std = Number(editingItem.allowanceStandard || 0);
          editingItem.amount = Number((days * std).toFixed(2));
          recomputeAmounts();
        };

        const onCurrencyChange = val => {
          if (!val || val === 1) {
            editingItem.rate = 1.0000;
          } else if (val === 2) {
            editingItem.rate = 7.1250;
          } else if (val === 3) {
            editingItem.rate = 7.7820;
          } else if (val === 4) {
            editingItem.rate = 0.9150;
          }
          recomputeAmounts();
        };

        const onExpenseTypeChange = val => {
          if (val === 'EXP-AIR-01') {
            editingItem.fromPlace = '上海虹桥';
            editingItem.toPlace = '深圳宝安';
            editingItem.vehicle = '飞机';
          } else if (val === 'EXP-TAXI-01') {
            editingItem.fromPlace = '深圳宝安机场';
            editingItem.toPlace = '蛇口招商港口';
            editingItem.vehicle = '出租车';
          } else if (val === 'EXP-HOTEL-01') {
            editingItem.city = '深圳';
            editingItem.checkInDate = window.dayjs('2026-10-16');
            editingItem.checkOutDate = window.dayjs('2026-10-18');
          }
        };

        const addManualInvoice = () => {
          if (!editingItem.invoices) editingItem.invoices = [];
          editingItem.invoices.push({
            key: 'inv-' + Date.now(),
            source: 1, // 1: 手工录入
            invoiceKind: 0,
            invoiceCode: '',
            invoiceNo: '',
            invoiceDate: window.dayjs().format('YYYY-MM-DD'),
            sellerHeader: '',
            sellerTaxNo: '',
            buyerTaxNo: '913100007178XXXXXX',
            amount: null,
            exTaxAmount: null,
            taxAmount: null,
            attachment: null
          });
        };

        const openInputInvoicePicker = () => {
          if (!editingItem.invoices) editingItem.invoices = [];
          editingItem.invoices.push({
            key: 'inv-input-' + Date.now(),
            source: 0, // 0: 进项发票
            invoiceKind: 0,
            invoiceCode: '044002100222',
            invoiceNo: '88392019',
            invoiceDate: '2026-10-17',
            sellerHeader: '上海锦江出租车客运有限公司',
            sellerTaxNo: '91310115MA1K4XXXXX',
            buyerTaxNo: '913100007178XXXXXX',
            amount: 86.00,
            exTaxAmount: 83.50,
            taxAmount: 2.50,
            attachment: { name: '进项电子行程单_88392019.pdf', size: '320KB' }
          });
          antd.message.success('已从进项发票池关联 1 张发票');
        };

        const simulateUploadRecognize = () => {
          if (!editingItem.invoices) editingItem.invoices = [];
          editingItem.invoices.push({
            key: 'inv-ocr-' + Date.now(),
            source: 1,
            invoiceKind: 0,
            invoiceCode: '031002200111',
            invoiceNo: '62910482',
            invoiceDate: window.dayjs().format('YYYY-MM-DD'),
            sellerHeader: '上海欣运国际物流有限公司',
            sellerTaxNo: '91310115MA1K48910X',
            buyerTaxNo: '913100007178XXXXXX',
            amount: 236.00,
            exTaxAmount: 222.64,
            taxAmount: 13.36,
            attachment: { name: '增值税专用发票_识别原件.pdf', size: '1.2MB' }
          });
          antd.message.success('发票 OCR 智能识别成功，已自动提取发票代码、号码与税额！');
        };

        const simulateAttachUpload = (inv) => {
          inv.attachment = {
            name: `电子发票附件_${Date.now().toString().slice(-4)}.pdf`,
            size: '860KB'
          };
          antd.message.success('发票凭证附件上传成功');
        };

        const removeInvoice = (idx) => {
          editingItem.invoices.splice(idx, 1);
          antd.message.info('已移除发票');
        };

        const calcTax = (inv) => {
          if (inv.amount && !inv.exTaxAmount) {
            inv.exTaxAmount = Number((inv.amount / 1.06).toFixed(2));
            inv.taxAmount = Number((inv.amount - inv.exTaxAmount).toFixed(2));
          }
        };

        const calcTaxFromEx = (inv) => {
          if (inv.exTaxAmount && !inv.amount) {
            inv.amount = Number((inv.exTaxAmount * 1.06).toFixed(2));
            inv.taxAmount = Number((inv.amount - inv.exTaxAmount).toFixed(2));
          }
        };

        // 表格列定义 (已根据反馈移除操作列，统一改为顶部集成工具栏操作)
        const itemColumns = [
          { title: '#', key: 'index', width: 44, align: 'center' },
          { title: '报销类型', key: 'type', width: 170 },
          { title: '发生日期', key: 'occurDate', width: 104 },
          { title: '原币金额', key: 'amount', width: 136, align: 'right' },
          { title: '汇率', key: 'rate', width: 80, align: 'right' },
          { title: '本位币金额（RMB）', key: 'localAmount', width: 140, align: 'right' },
          { title: '发票', key: 'invoices', width: 130 },
          { title: '明细', key: 'extra', width: 220 },
          { title: '说明 / 无票说明', key: 'description', width: 240 },
          { title: '关联', key: 'link', width: 140 }
        ];

        // 顶部集成工具栏操作逻辑 (多选、单选编辑、上移、下移、批量删除)
        const selectedRowKeys = ref(['item-2']);

        const rowSelection = computed(() => {
          return {
            selectedRowKeys: selectedRowKeys.value,
            onChange: (keys) => {
              selectedRowKeys.value = keys;
            }
          };
        });

        const canMoveUp = computed(() => {
          if (selectedRowKeys.value.length !== 1) return false;
          const idx = claim.items.findIndex(i => i.id === selectedRowKeys.value[0]);
          return idx > 0;
        });

        const canMoveDown = computed(() => {
          if (selectedRowKeys.value.length !== 1) return false;
          const idx = claim.items.findIndex(i => i.id === selectedRowKeys.value[0]);
          return idx >= 0 && idx < claim.items.length - 1;
        });

        const editSelectedRow = () => {
          if (selectedRowKeys.value.length !== 1) return;
          const found = claim.items.find(i => i.id === selectedRowKeys.value[0]);
          if (found) openItemModal(found);
        };

        const moveSelectedRow = (direction) => {
          if (selectedRowKeys.value.length !== 1) return;
          const idx = claim.items.findIndex(i => i.id === selectedRowKeys.value[0]);
          if (idx < 0) return;
          const targetIndex = idx + direction;
          if (targetIndex < 0 || targetIndex >= claim.items.length) return;
          const temp = claim.items[idx];
          claim.items[idx] = claim.items[targetIndex];
          claim.items[targetIndex] = temp;
          isDirty.value = true;
          antd.message.success('已调整明细顺序');
        };

        const deleteSelectedRows = () => {
          if (selectedRowKeys.value.length === 0) return;
          claim.items = claim.items.filter(i => !selectedRowKeys.value.includes(i.id));
          selectedRowKeys.value = [];
          claim.totalAmount = claim.items.reduce((sum, cur) => sum + Number(cur.localAmount || 0), 0);
          isDirty.value = true;
          antd.message.success('已批量删除所选明细行');
        };

        const customRow = (record) => {
          return {
            onClick: () => {
              if (selectedRowKeys.value.includes(record.id)) {
                selectedRowKeys.value = selectedRowKeys.value.filter(k => k !== record.id);
              } else {
                selectedRowKeys.value = [record.id];
              }
            },
            onDblclick: () => {
              openItemModal(record);
            },
            style: { cursor: 'pointer' }
          };
        };

        const deleteAttachment = (idx) => {
          claim.attachments.splice(idx, 1);
          isDirty.value = true;
          antd.message.success('已删除单据附件');
        };

        const uploadAttachment = () => {
          const newId = 'att-' + Date.now();
          claim.attachments.push({
            attachmentId: newId,
            fileName: `补充业务报销凭证_${Date.now().toString().slice(-4)}.pdf`
          });
          isDirty.value = true;
          antd.message.success('已上传新单据附件');
        };

        const syncAmountToParent = (inv) => {
          if (inv.amount) {
            editingItem.amount = Number(inv.amount);
            recomputeAmounts();
            antd.message.success(`已将发票价税合计 ¥${Number(inv.amount).toFixed(2)} 同步至申报金额`);
          }
        };

        const getStatusTagColor = status => {
          const map = { 0: 'default', 1: 'processing', 2: 'error', 3: 'success', 4: 'cyan' };
          return map[status] || 'default';
        };

        const statusLabel = s => {
          const map = { 0: '草稿', 1: '审核中', 2: '已驳回', 3: '已通过', 4: '已付款' };
          return map[s] || '未知';
        };

        const getInvoiceKindLabel = kind => {
          const map = {
            0: '增值税专用发票',
            1: '增值税普通发票',
            2: '增值税电子普通发票',
            3: '航空运输电子客票行程单',
            4: '铁路电子客票',
            5: '网约车行程单/电子发票'
          };
          return map[kind] || '普通发票';
        };

        const getItemIcon = record => {
          const code = record.expenseType?.code || '';
          if (code.includes('AIR')) return 'lucide:plane';
          if (code.includes('HOTEL')) return 'lucide:bed';
          if (code.includes('TAXI')) return 'lucide:car';
          if (code.includes('OVERSEAS')) return 'lucide:globe';
          return 'lucide:layers';
        };

        const formatDate = d => d ? String(d).substring(0, 10) : '-';
        const formatTime = t => t ? String(t).replace('T', ' ').substring(0, 19) : '-';
        const maskBankCard = card => card ? String(card).replace(/(\d{4})\d+(\d{4})/, '$1 **** **** $2') : '-';

        const copyText = (txt, msg) => {
          navigator.clipboard.writeText(txt);
          antd.message.success(msg || '已复制');
        };

        const isExpanded = record => expandedItemKeys.value.includes(record.id);

        const toggleInvoices = record => {
          if (isExpanded(record)) {
            expandedItemKeys.value = expandedItemKeys.value.filter(k => k !== record.id);
          } else {
            expandedItemKeys.value = [...expandedItemKeys.value, record.id];
          }
        };

        const handleWithdraw = () => {
          antd.message.info('发起撤回请求');
        };

        const handleSave = () => {
          saving.value = true;
          setTimeout(() => {
            saving.value = false;
            isDirty.value = false;
            antd.message.success('报销单修改已保存');
          }, 350);
        };

        const handleSaveAndSubmit = () => {
          submitting.value = true;
          setTimeout(() => {
            submitting.value = false;
            claim.status = 1;
            antd.message.success('已重新提交审核！');
          }, 500);
        };

        const openItemModal = record => {
          if (record) {
            editingItem.id = record.id;
            editingItem.expenseTypeId = record.expenseType?.id || 'EXP-AIR-01';
            editingItem.occurDate = record.occurDate ? window.dayjs(record.occurDate) : window.dayjs('2026-10-18');
            editingItem.amount = record.amount;
            editingItem.currencyId = record.currency?.id || 1;
            editingItem.rate = record.rate || 1.0000;
            editingItem.localAmount = record.localAmount || record.amount;
            editingItem.clientId = record.clientId || 1;
            editingItem.transportOrderBizType = record.transportOrderBizType || '海运出口';
            editingItem.transportOrderId = record.transportOrderId || record.transportOrder || 'JHTSE261013068';
            editingItem.noInvoiceReason = record.noInvoiceReason || '';
            editingItem.description = record.description || '';
            editingItem.fromPlace = record.fromPlace || '上海虹桥';
            editingItem.toPlace = record.toPlace || '深圳宝安';
            editingItem.vehicle = record.vehicle || '飞机';
            editingItem.city = record.city || '深圳';
            editingItem.checkInDate = window.dayjs('2026-10-16');
            editingItem.checkOutDate = window.dayjs('2026-10-18');
            editingItem.guestCount = 2;
            editingItem.guestDescription = '';
            editingItem.allowanceDays = 1;
            editingItem.allowanceStandard = 150;
            editingItem.invoices = record.invoices ? record.invoices.map(inv => ({
              ...JSON.parse(JSON.stringify(inv)),
              isExpanded: true
            })) : [];
          } else {
            // 点击“添加费用行”：默认呈现与用户截图一致的高保真初态（包含发票卡片骨架）
            editingItem.id = null;
            editingItem.expenseTypeId = null;
            editingItem.occurDate = window.dayjs('2026-10-18');
            editingItem.amount = null;
            editingItem.currencyId = null;
            editingItem.rate = 1.0000;
            editingItem.localAmount = null;
            editingItem.clientId = null;
            editingItem.transportOrderBizType = '海运出口';
            editingItem.transportOrderId = 'JHTSE261013068';
            editingItem.noInvoiceReason = '';
            editingItem.description = '';
            editingItem.fromPlace = '';
            editingItem.toPlace = '';
            editingItem.vehicle = '飞机';
            editingItem.city = '深圳';
            editingItem.checkInDate = null;
            editingItem.checkOutDate = null;
            editingItem.guestCount = 2;
            editingItem.guestDescription = '';
            editingItem.allowanceDays = 1;
            editingItem.allowanceStandard = 150;
            // 预置与截图一致的 2 张发票示例（两张均支持展开/收起/直接编辑交互）
            editingItem.invoices = [
              {
                key: 'inv-init-1',
                source: 1, // 手工录入
                invoiceKind: 0, // 增值税专用发票
                invoiceCode: '',
                invoiceNo: '',
                invoiceDate: '2026-10-18',
                sellerHeader: '',
                sellerTaxNo: '',
                buyerTaxNo: '',
                amount: null,
                exTaxAmount: null,
                taxAmount: null,
                attachment: null,
                isExpanded: true
              },
              {
                key: 'inv-init-2',
                source: 0, // 进项采集
                invoiceKind: 0,
                invoiceCode: '044002100222',
                invoiceNo: '88392019',
                invoiceDate: '2026-10-17',
                sellerHeader: '上海锦江出租车客运有限公司',
                sellerTaxNo: '91310115MA1K4XXXXX',
                buyerTaxNo: '913100007178XXXXXX',
                amount: 86.00,
                exTaxAmount: 83.50,
                taxAmount: 2.50,
                attachment: { name: '进项电子行程单_88392019.pdf', size: '320KB' },
                isExpanded: true
              }
            ];
          }
          itemModalVisible.value = true;
        };

        const saveItemModal = () => {
          const dateStr = editingItem.occurDate ? (window.dayjs.isDayjs(editingItem.occurDate) ? editingItem.occurDate.format('YYYY-MM-DD') : String(editingItem.occurDate)) : '2026-10-18';
          const typeFound = expenseTypeOptions.find(t => t.value === editingItem.expenseTypeId);
          const typeName = typeFound ? typeFound.label.split(' ')[0] : '日常费用';
          const localAmt = editingItem.localAmount !== null ? Number(editingItem.localAmount) : Number(editingItem.amount || 0);

          let extraStr = '-';
          if (currentExpenseCategory.value === 'transport') {
            extraStr = `${editingItem.fromPlace || ''} - ${editingItem.toPlace || ''} (${editingItem.vehicle || ''})`;
          } else if (currentExpenseCategory.value === 'hotel') {
            extraStr = `${editingItem.city || ''} 住宿 ${hotelNightsPreview.value} 晚`;
          }

          if (editingItem.id) {
            const item = claim.items.find(i => i.id === editingItem.id);
            if (item) {
              item.expenseType = { id: editingItem.expenseTypeId, name: typeName, code: 'EXP-MOD' };
              item.occurDate = dateStr;
              item.amount = Number(editingItem.amount || 0);
              item.rate = Number(editingItem.rate || 1.0);
              item.localAmount = localAmt;
              item.extra = extraStr !== '-' ? extraStr : item.extra;
              item.noInvoiceReason = editingItem.noInvoiceReason;
              item.description = editingItem.description;
              item.transportOrder = editingItem.transportOrderId;
              item.invoices = JSON.parse(JSON.stringify(editingItem.invoices || []));
            }
          } else {
            claim.items.push({
              id: 'item-' + Date.now(),
              expenseType: { id: editingItem.expenseTypeId || 'EXP-GEN', name: typeName, code: 'EXP-CUSTOM' },
              occurDate: dateStr,
              currency: { code: editingItem.currencyId === 2 ? 'USD' : 'RMB', id: editingItem.currencyId || 1 },
              amount: Number(editingItem.amount || 0),
              rate: Number(editingItem.rate || 1.0),
              localAmount: localAmt,
              extra: extraStr,
              description: editingItem.description,
              noInvoiceReason: editingItem.noInvoiceReason,
              transportOrder: editingItem.transportOrderId,
              invoices: JSON.parse(JSON.stringify(editingItem.invoices || []))
            });
          }
          claim.totalAmount = claim.items.reduce((sum, cur) => sum + Number(cur.localAmount || 0), 0);
          itemModalVisible.value = false;
          isDirty.value = true;
          antd.message.success('费用明细已更新并重算合计');
        };

        const moveItem = (index, direction) => {
          const targetIndex = index + direction;
          if (targetIndex < 0 || targetIndex >= claim.items.length) return;
          const temp = claim.items[index];
          claim.items[index] = claim.items[targetIndex];
          claim.items[targetIndex] = temp;
          isDirty.value = true;
        };

        const deleteItem = index => {
          claim.items.splice(index, 1);
          claim.totalAmount = claim.items.reduce((sum, cur) => sum + Number(cur.localAmount || 0), 0);
          isDirty.value = true;
          antd.message.success('已删除明细行');
        };

        return {
          themeConfig,
          claim,
          auditHistory,
          activeRoundTab,
          isDirty,
          saving,
          submitting,
          canWithdraw,
          itemModalVisible,
          editingItem,
          expandedItemKeys,
          currentOrgName,
          userOptions,
          orgOptions,
          bankAccountOptions,
          expenseTypeOptions,
          currencyOptions,
          currencySelectOptions,
          clientOptions,
          businessTypeOptions,
          businessOrderOptions,
          invoiceKindOptions,
          vehicleOptions,
          currentExpenseCategory,
          hotelNightsPreview,
          itemColumns,
          selectedRowKeys,
          rowSelection,
          canMoveUp,
          canMoveDown,
          editSelectedRow,
          moveSelectedRow,
          deleteSelectedRows,
          customRow,
          deleteAttachment,
          uploadAttachment,
          syncAmountToParent,
          getStatusTagColor,
          statusLabel,
          getInvoiceKindLabel,
          getItemIcon,
          formatDate,
          formatTime,
          maskBankCard,
          copyText,
          isExpanded,
          toggleInvoices,
          handleWithdraw,
          handleSave,
          handleSaveAndSubmit,
          openItemModal,
          saveItemModal,
          moveItem,
          deleteItem,
          recomputeAmounts,
          recomputeAllowance,
          onCurrencyChange,
          onExpenseTypeChange,
          addManualInvoice,
          openInputInvoicePicker,
          simulateUploadRecognize,
          simulateAttachUpload,
          removeInvoice,
          calcTax,
          calcTaxFromEx,
          antd
        };
      }
    });

    app.use(antd).mount('#app');
  </script>
</body>
</html>
