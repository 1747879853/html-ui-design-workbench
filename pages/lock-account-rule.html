<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动锁账规则 - 财务结算管理中心</title>

  <!-- 核心样式：Ant Design Vue 4 重置样式与通用规范 -->
  <link rel="stylesheet" href="../assets/vendor/reset.css">
  <link rel="stylesheet" href="../assets/css/common.css">

  <!-- 本地极速资源：零延迟无代理依赖 -->
  <script src="../assets/vendor/dayjs-bundle.min.js"></script>
  <script src="../assets/vendor/vue.global.prod.js"></script>
  <script src="../assets/vendor/antd.min.js"></script>
  <script src="../assets/vendor/iconify-icon.min.js"></script>
  <script src="../assets/js/common.js"></script>

  <style>
    /* ==========================================================================
       企业级 B2B 财务结算·自动锁账规则 高保真优化规范
       设计基准：1920×1080 宽屏视口，严谨专业金融级排版，彻底去除 AI 杂质
       ========================================================================== */

    body {
      background-color: #f4f6f9;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      min-height: 100vh;
      padding: 12px 16px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 顶部控制台头部 */
    .header-bar {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 20px;
      color: #1890ff;
      display: flex;
      align-items: center;
    }

    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }

    .header-tab-switch {
      margin-left: 6px;
    }

    .header-stat-tag {
      font-size: 12px;
      color: #6b7280;
      background: #f3f4f6;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* 紧凑型系统固定规则通知条 */
    .system-notice-bar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 3px solid #3b82f6;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 12px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .system-notice-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .system-notice-tag {
      font-weight: 600;
      color: #1e40af;
      background: #dbeafe;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
    }

    /* 主表格卡片容器 */
    .table-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 表格顶部工具栏 */
    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 执行记录过滤检索区 */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px 14px;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px 16px 4px;
      margin-bottom: 10px;
    }

    .filter-grid .ant-form-item {
      margin-bottom: 8px !important;
    }

    .filter-grid .ant-form-item-label > label {
      font-size: 12px;
      color: #4b5563;
      font-weight: 500;
    }

    /* 规则详情与编辑抽屉样式 */
    .drawer-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    .drawer-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .drawer-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drawer-section-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 13px;
      background: #1890ff;
      border-radius: 2px;
    }

    .form-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px 14px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 14px;
    }

    .form-col-span-2 {
      grid-column: span 2;
    }

    .form-col-span-3 {
      grid-column: span 3;
    }

    .form-col-span-4 {
      grid-column: span 4;
    }

    .field-label {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .field-required {
      color: #ef4444;
      margin-right: 2px;
    }

    .field-help {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* 条件编辑器卡片 */
    .condition-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .condition-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 6px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
    }

    .condition-op {
      width: 65px;
    }

    .condition-field {
      width: 150px;
    }

    .condition-should {
      width: 100px;
    }

    .condition-val {
      flex: 1;
    }

    /* 试算沙盘区 */
    .trial-box {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
    }

    .trial-stat-ribbon {
      display: flex;
      gap: 12px;
      margin: 10px 0;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
    }

    /* 紧凑型表格微调 */
    .ant-table-wrapper .ant-table-thead > tr > th {
      background: #fafafa !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #374151 !important;
      padding: 8px 10px !important;
      border-bottom: 1px solid #e5e7eb !important;
    }

    .ant-table-wrapper .ant-table-tbody > tr > td {
      font-size: 12px !important;
      padding: 7px 10px !important;
      border-bottom: 1px solid #f3f4f6 !important;
    }

    .ant-table-wrapper .ant-table-tbody > tr:hover > td {
      background-color: #f0f7ff !important;
    }

    .rule-name-cell {
      font-weight: 600;
      color: #111827;
    }

    .company-sub-tag {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* 执行明细抽屉摘要指示栏 */
    .run-summary-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="app-template">
    <a-config-provider :theme="themeConfig">
      <div class="page-wrap">

        <!-- 顶部控制台 -->
        <div class="header-bar">
          <div class="header-left">
            <div class="header-title-group">
              <span class="header-icon">
                <iconify-icon icon="ant-design:safety-certificate-outlined"></iconify-icon>
              </span>
              <h2 class="header-title">自动锁账规则</h2>
            </div>

            <!-- Tab 页签切换 -->
            <a-radio-group
              v-model:value="activeTab"
              button-style="solid"
              size="small"
              class="header-tab-switch"
            >
              <a-radio-button value="rules">规则列表 ({{ rules.length }})</a-radio-button>
              <a-radio-button value="runs">执行记录 ({{ runRecords.length }})</a-radio-button>
            </a-radio-group>

            <span class="header-stat-tag">
              已启用 {{ enabledRulesCount }} 条 · 停用 {{ rules.length - enabledRulesCount }} 条
            </span>
          </div>

          <!-- 顶部右侧快捷操作 -->
          <div class="header-right">
            <a-space>
              <a-button
                v-if="activeTab === 'rules'"
                type="primary"
                @click="openCreateModal"
              >
                <template #icon><iconify-icon icon="ant-design:plus-outlined"></iconify-icon></template>
                新建规则
              </a-button>
              <a-button
                v-else
                @click="resetRunFilter"
              >
                <template #icon><iconify-icon icon="ant-design:redo-outlined"></iconify-icon></template>
                重置查询
              </a-button>
            </a-space>
          </div>
        </div>

        <!-- 紧凑型系统固定规则通知条 (彻底去 AI 杂质，严密对齐财务风控底线) -->
        <div class="system-notice-bar">
          <div class="system-notice-content">
            <span class="system-notice-tag">系统内置底线条件</span>
            <span>① 业务未标记「未完结」 ② 本单费用全部审核通过 ③ 没有待审核的费用任务。三项系统固定条件对每条规则强制生效；附加条件在此基础上加严；解锁时勾选「暂停自动锁账」的票将跳过。</span>
          </div>
          <a-tooltip title="审核通过规则按排序每票取第一条命中的规则（延迟规则亦计算在内）；定时规则在预定日期执行对应期间批量锁账。">
            <iconify-icon icon="ant-design:question-circle-outlined" style="cursor: help; color: #94a3b8;"></iconify-icon>
          </a-tooltip>
        </div>

        <!-- 视图 1：规则列表 (Tab 1) -->
        <div v-show="activeTab === 'rules'" class="table-card">
          <!-- 统一顶部集成操作栏 (依照 SKILL.md Section 3 移除每行重复按钮) -->
          <div class="table-toolbar">
            <div class="toolbar-left">
              <span class="toolbar-title">自动锁账规则矩阵</span>
              <a-tag color="blue">共 {{ rules.length }} 条规则</a-tag>
              <a-tag v-if="selectedRuleKeys.length > 0" color="purple">
                已选 {{ selectedRuleKeys.length }} 项
              </a-tag>
            </div>
            <div class="toolbar-right">
              <a-space size="small">
                <a-button
                  type="primary"
                  @click="openCreateModal"
                >
                  <template #icon><iconify-icon icon="ant-design:plus-outlined"></iconify-icon></template>
                  新建规则
                </a-button>
                <a-button
                  :disabled="selectedRuleKeys.length !== 1"
                  @click="editSelectedRule"
                >
                  <template #icon><iconify-icon icon="ant-design:edit-outlined"></iconify-icon></template>
                  编辑规则
                </a-button>
                <a-button
                  :disabled="!canRunSelectedNow"
                  :loading="runningNow"
                  @click="confirmRunNowSelected"
                >
                  <template #icon><iconify-icon icon="ant-design:play-circle-outlined"></iconify-icon></template>
                  立即执行
                </a-button>
                <a-button
                  :disabled="selectedRuleKeys.length !== 1"
                  @click="viewSelectedRuns"
                >
                  <template #icon><iconify-icon icon="ant-design:history-outlined"></iconify-icon></template>
                  执行记录
                </a-button>
                <a-popconfirm
                  title="确认删除选中的规则？"
                  description="若尚有已锁账票件关联该规则，后端将建议改为停用。"
                  ok-text="确认删除"
                  cancel-text="取消"
                  ok-type="danger"
                  @confirm="deleteSelectedRules"
                >
                  <a-button
                    danger
                    :disabled="selectedRuleKeys.length === 0"
                  >
                    <template #icon><iconify-icon icon="ant-design:delete-outlined"></iconify-icon></template>
                    删除
                  </a-button>
                </a-popconfirm>
              </a-space>
            </div>
          </div>

          <!-- 高密度规则表格 (自适应宽度，消除留白断层) -->
          <a-table
            :data-source="rules"
            :columns="ruleColumns"
            :row-key="record => record.id"
            :row-selection="{ selectedRowKeys: selectedRuleKeys, onChange: onRuleSelectionChange }"
            :custom-row="customRuleRow"
            :pagination="false"
            size="small"
            :scroll="{ x: 1380, y: 560 }"
          >
            <!-- 规则名称与适用公司 -->
            <template #bodyCell="{ column, record }">
              <template v-if="column.key === 'name' || column.dataIndex === 'name'">
                <div class="rule-name-cell">{{ record.name }}</div>
                <div class="company-sub-tag">
                  <iconify-icon icon="ant-design:bank-outlined" style="margin-right: 3px; vertical-align: -1px;"></iconify-icon>
                  {{ formatCompanies(record.companies) }}
                </div>
              </template>

              <!-- 启停开关 -->
              <template v-else-if="column.key === 'enable'">
                <a-switch
                  :checked="record.enable"
                  size="small"
                  @change="val => toggleRuleEnable(record, val)"
                ></a-switch>
              </template>

              <!-- 触发方式与执行设置 -->
              <template v-else-if="column.key === 'trigger'">
                <a-tag :color="record.triggerType === 0 ? 'cyan' : 'geekblue'">
                  {{ record.triggerType === 0 ? '定时批量执行' : '费用审核通过后' }}
                </a-tag>
                <div style="font-size: 11px; color: #4b5563; margin-top: 3px;">
                  {{ formatScheduleText(record) }}
                </div>
              </template>

              <!-- 锁定对象 -->
              <template v-else-if="column.key === 'targets'">
                <a-space size="small">
                  <a-tag v-if="record.lockMain" color="default">主单原票</a-tag>
                  <a-tag v-if="record.lockChange" color="default">更改单</a-tag>
                </a-space>
              </template>

              <!-- 附加条件 -->
              <template v-else-if="column.key === 'conditions'">
                <div v-if="(record.conditions || []).length > 0">
                  <div
                    v-for="(c, idx) in record.conditions"
                    :key="idx"
                    style="font-size: 11px; color: #374151; line-height: 1.4;"
                  >
                    <span style="color: #6b7280; font-weight: 500;">{{ idx > 0 ? (c.isOr ? '或 ' : '且 ') : '' }}</span>
                    <span>{{ c.fieldName }} {{ c.operator }} <b>{{ c.valueText }}</b></span>
                  </div>
                </div>
                <span v-else style="color: #9ca3af; font-size: 11px;">无附加条件 (仅系统固定条件)</span>
              </template>

              <!-- 不满足的处理动作 -->
              <template v-else-if="column.key === 'failAction'">
                <template v-if="record.triggerType === 0">
                  <a-tag :color="record.failAction === 1 ? 'orange' : 'default'">
                    {{ record.failAction === 1 ? '顺延到下一期' : '保留在原期间' }}
                  </a-tag>
                  <div style="font-size: 11px; color: #6b7280; margin-top: 2px;">
                    {{ record.autoClose ? '锁完自动结转该期' : '锁完不结转' }}
                  </div>
                </template>
                <template v-else>
                  <span style="font-size: 11px; color: #6b7280;">不锁，等下次审核判断</span>
                </template>
              </template>

              <!-- 最近执行 -->
              <template v-else-if="column.key === 'lastRun'">
                <div v-if="record.lastRun">
                  <div style="font-size: 11px; font-weight: 600; color: #111827;">
                    {{ record.lastRun.time }} 
                    <span style="color: #059669;">锁 {{ record.lastRun.lockedCount }}</span> · 
                    <span style="color: #d97706;">跳 {{ record.lastRun.skippedCount }}</span> · 
                    <span style="color: #4b5563;">顺 {{ record.lastRun.deferredCount }}</span>
                  </div>
                  <div v-if="record.lastRun.closeResult" style="font-size: 11px; color: #d97706; margin-top: 1px;">
                    {{ record.lastRun.closeResult }}
                  </div>
                </div>
                <span v-else style="color: #9ca3af; font-size: 11px;">尚未执行</span>
              </template>

              <!-- 排序 -->
              <template v-else-if="column.key === 'sortId'">
                <a-tag color="purple" style="font-weight: 600;">{{ record.sortId }}</a-tag>
              </template>

              <!-- 修改人与时间 -->
              <template v-else-if="column.key === 'modified'">
                <div style="font-size: 11px; color: #374151;">{{ record.lastModifierUserName || record.creatorUserName || '-' }}</div>
                <div style="font-size: 10px; color: #9ca3af;">{{ record.lastModificationTime || record.creationTime || '-' }}</div>
              </template>
            </template>
          </a-table>
        </div>

        <!-- 视图 2：执行记录 (Tab 2) -->
        <div v-show="activeTab === 'runs'">
          <!-- 检索过滤器 -->
          <div class="filter-grid">
            <a-form-item label="所属规则">
              <a-select
                v-model:value="runFilter.ruleId"
                allow-clear
                placeholder="全部规则"
                :options="ruleSelectOptions"
              ></a-select>
            </a-form-item>

            <a-form-item label="触发方式">
              <a-select
                v-model:value="runFilter.triggerType"
                allow-clear
                placeholder="全部触发方式"
                :options="[
                  { label: '全部', value: '' },
                  { label: '定时执行', value: 0 },
                  { label: '费用审核通过后', value: 1 }
                ]"
              ></a-select>
            </a-form-item>

            <a-form-item label="执行时间">
              <a-range-picker
                v-model:value="runFilter.dateRange"
                style="width: 100%;"
              ></a-range-picker>
            </a-form-item>

            <a-form-item label=" " :colon="false">
              <a-space>
                <a-button type="primary" @click="searchRuns">
                  <template #icon><iconify-icon icon="ant-design:search-outlined"></iconify-icon></template>
                  查询
                </a-button>
                <a-button @click="resetRunFilter">重置</a-button>
              </a-space>
            </a-form-item>
          </div>

          <!-- 执行记录表格卡片 -->
          <div class="table-card">
            <div class="table-toolbar">
              <div class="toolbar-left">
                <span class="toolbar-title">自动锁账执行日志</span>
                <a-tag color="blue">共 {{ filteredRuns.length }} 笔记录</a-tag>
                <a-tag v-if="selectedRunKeys.length > 0" color="purple">
                  已选 {{ selectedRunKeys.length }} 项
                </a-tag>
              </div>
              <div class="toolbar-right">
                <a-space size="small">
                  <a-button
                    :disabled="selectedRunKeys.length !== 1"
                    type="primary"
                    @click="openSelectedRunDetail"
                  >
                    <template #icon><iconify-icon icon="ant-design:file-text-outlined"></iconify-icon></template>
                    查看执行明细
                  </a-button>
                </a-space>
              </div>
            </div>

            <!-- 执行记录表格 -->
            <a-table
              :data-source="filteredRuns"
              :columns="runColumns"
              :row-key="record => record.id"
              :row-selection="{ selectedRowKeys: selectedRunKeys, onChange: onRunSelectionChange, type: 'radio' }"
              :custom-row="customRunRow"
              :pagination="{ pageSize: 10, showSizeChanger: true, showTotal: t => `共 ${t} 条` }"
              size="small"
              :scroll="{ x: 1300, y: 520 }"
            >
              <template #bodyCell="{ column, record }">
                <!-- 规则名称 -->
                <template v-if="column.key === 'ruleName'">
                  <div style="font-weight: 600; color: #111827;">{{ record.ruleName }}</div>
                </template>

                <!-- 触发方式 -->
                <template v-else-if="column.key === 'triggerType'">
                  <a-tag :color="record.triggerType === 0 ? 'cyan' : 'geekblue'">
                    {{ record.triggerType === 0 ? '定时' : '费用审核通过后' }}
                  </a-tag>
                </template>

                <!-- 手动 -->
                <template v-else-if="column.key === 'isManual'">
                  <span :style="{ color: record.isManual ? '#d97706' : '#6b7280', fontWeight: record.isManual ? '600' : 'normal' }">
                    {{ record.isManual ? '是 (手动触发)' : '否 (调度器)' }}
                  </span>
                </template>

                <!-- 期间 -->
                <template v-else-if="column.key === 'period'">
                  <a-tag color="default" style="font-family: monospace;">{{ record.period || '多个期间' }}</a-tag>
                </template>

                <!-- 锁定 / 跳过 / 顺延 -->
                <template v-else-if="column.key === 'counts'">
                  <a-space size="small">
                    <a-tag color="success">锁 {{ record.lockedCount }}</a-tag>
                    <a-tag color="warning">跳 {{ record.skippedCount }}</a-tag>
                    <a-tag color="default">顺 {{ record.deferredCount }}</a-tag>
                  </a-space>
                </template>

                <!-- 自动结转 -->
                <template v-else-if="column.key === 'closeResult'">

        const filteredRuns = computed(() => {
          return runRecords.value.filter(r => {
            if (runFilter.ruleId && r.ruleId !== runFilter.ruleId) return false;
            if (runFilter.triggerType !== '' && r.triggerType !== runFilter.triggerType) return false;

        });

        const ruleSelectOptions = computed(() => {
          return [

          { title: '锁账期间', dataIndex: 'period', key: 'period', width: 100 },
          { title: '处理票数 (锁 / 跳 / 顺)', dataIndex: 'counts', key: 'counts', width: 170 },
          { title: '自动结转结果', dataIndex: 'closeResult', key: 'closeResult', width: 250 },

        const runItemColumns = [
          { title: '业务单号', dataIndex: 'commissionNum', key: 'ticket', width: 180 },
          { title: '业务类型', dataIndex: 'bizType', key: 'bizType', width: 110 },
          { title: '锁账结果', dataIndex: 'result', key: 'result', width: 90, align: 'center' },
          { title: '受阻/跳过原因', dataIndex: 'reason', key: 'reason', width: 180 },
          { title: '说明', dataIndex: 'message', key: 'message' }
        ];

        // 试算表格列
        const trialColumns = [
          { title: '业务号', dataIndex: 'ticketNo', key: 'ticketNo', width: 160 },
          { title: '类型', dataIndex: 'bizType', key: 'bizType', width: 90 },
          { title: '试算结果', key: 'result', width: 90, align: 'center' },
          { title: '受阻原因', dataIndex: 'reason', key: 'reason', width: 160 },
          { title: '明细说明', dataIndex: 'note', key: 'note' }
        ];

        // 当前编辑的规则表单
        const editingRule = reactive({
          id: '',
          name: '',
          companyIds: [],
          enable: true,
          sortId: 1,
          remark: '',
          triggerType: 0,
          scheduleDay: 10,
          scheduleTime: '02:00',
          monthsBack: 1,
          failAction: 1,
          autoClose: true,
          lockMain: true,
          lockChange: true,
          delayDays: 0,
          notifyUserIds: ['35'],
          notifyOnlyOnException: false,
          conditions: []
        });

        // 格式化函数
        function formatCompanies(compIds) {
          if (!compIds || compIds.length === 0) return '全部分公司通用';
          const names = compIds.map(id => {
            const found = companyOptions.find(c => c.value === id);
            return found ? found.label.split(' ')[0] : id;
          });
          return names.join('、');
        }

        function formatScheduleText(r) {
          if (r.triggerType === 0) {
            return `每月 ${r.scheduleDay} 日 ${r.scheduleTime} 锁上 ${r.monthsBack} 个月`;
          } else {
            return r.delayDays > 0 ? `审核通过满 ${r.delayDays} 天后锁` : '审核通过立即锁';
          }
        }

        function closeResultTagColor(status) {
          if (status.includes('已结转')) return 'success';
          if (status.includes('部分')) return 'warning';
          if (status.includes('未结转')) return 'error';
          return 'default';
        }

        // 行选择事件
        function onRuleSelectionChange(keys) {
          selectedRuleKeys.value = keys;
        }

        function customRuleRow(record) {
          return {
            onClick: () => {
              selectedRuleKeys.value = [record.id];
            },
            onDblclick: () => {
              selectedRuleKeys.value = [record.id];
              editSelectedRule();
            }
          };
        }

        function onRunSelectionChange(keys) {
          selectedRunKeys.value = keys;
        }

        function customRunRow(record) {
          return {
            onClick: () => {
              selectedRunKeys.value = [record.id];
            },
            onDblclick: () => {
              openRunDetail(record);
            }
          };
        }

        // 按钮状态与操作
        const canRunSelectedNow = computed(() => {
          if (selectedRuleKeys.value.length !== 1) return false;
          const r = rules.value.find(item => item.id === selectedRuleKeys.value[0]);
          return r && r.triggerType === 0;
        });

        function toggleRuleEnable(rule, val) {
          rule.enable = val;
          antd.message.success(`规则「${rule.name}」已${val ? '启用' : '停用'}`);
        }

        function openCreateModal() {
          Object.assign(editingRule, {
            id: '',
            name: '',
            companyIds: ['18'],
            enable: true,
            sortId: rules.value.length + 1,
            remark: '',
            triggerType: 0,
            scheduleDay: 10,
            scheduleTime: '02:00',
            monthsBack: 1,
            failAction: 1,
            autoClose: true,
            lockMain: true,
            lockChange: true,
            delayDays: 0,
            notifyUserIds: ['35'],
            notifyOnlyOnException: false,
            conditions: []
          });
          trialResult.value = null;
          ruleModalOpen.value = true;
        }

        function editSelectedRule() {
          const found = rules.value.find(r => r.id === selectedRuleKeys.value[0]);
          if (!found) return;
          Object.assign(editingRule, JSON.parse(JSON.stringify(found)));
          trialResult.value = null;
          ruleModalOpen.value = true;
        }

        function confirmRunNowSelected() {
          const found = rules.value.find(r => r.id === selectedRuleKeys.value[0]);
          if (!found) return;
          antd.Modal.confirm({
            title: `立即执行规则「${found.name}」？`,
            content: `系统将立即锁对应期间的票件，不影响原定时调度计划；停用的规则亦支持手动试跑。`,
            okText: '立即执行',
            cancelText: '取消',
            onOk: () => {
              runningNow.value = true;
              setTimeout(() => {
                runningNow.value = false;
                antd.message.success(`执行完成：锁定 1，跳过 0，顺延 0；自动结转：未结转`);
                // 增加一条执行记录
                runRecords.value.unshift({
                  id: `run-${Date.now()}`,
                  ruleId: found.id,
                  time: dayjs().format('YYYY-MM-DD HH:mm:ss'),
                  ruleName: found.name,
                  triggerType: found.triggerType,
                  isManual: true,
                  period: '2026-09',
                  lockedCount: 1,
                  skippedCount: 0,
                  deferredCount: 0,
                  closeResult: '未结转',
                  closeMessage: '分公司未设启用期间',
                  skippedReasons: '-',
                  creatorUserName: 'admin (管理员)',
                  items: [
                    { id: 'item-now', commissionNum: 'WF346-SE-SEP', isChange: false, bizType: '海运出口', result: '锁定', reason: '', message: '满足条件即时锁定成功' }
                  ]
                });
              }, 700);
            }
          });
        }

        function viewSelectedRuns() {
          const found = rules.value.find(r => r.id === selectedRuleKeys.value[0]);
          if (!found) return;
          runFilter.ruleId = found.id;
          activeTab.value = 'runs';
        }

        function deleteSelectedRules() {
          rules.value = rules.value.filter(r => !selectedRuleKeys.value.includes(r.id));
          selectedRuleKeys.value = [];
          antd.message.success('规则已成功删除');
        }

        function saveRule() {
          if (!editingRule.name.trim()) {
            antd.message.warning('请输入规则名称');
            return;
          }
          if (!editingRule.lockMain && !editingRule.lockChange) {
            antd.message.warning('锁定对象至少需要选择一项（主单或更改单）');
            return;
          }

          if (editingRule.id) {
            const idx = rules.value.findIndex(r => r.id === editingRule.id);
            if (idx !== -1) {
              rules.value[idx] = JSON.parse(JSON.stringify(editingRule));
            }
            antd.message.success('规则已更新保存');
          } else {
            const newObj = JSON.parse(JSON.stringify(editingRule));
            newObj.id = String(Date.now());
            newObj.lastRun = null;
            newObj.creatorUserName = 'admin';
            newObj.creationTime = dayjs().format('YYYY-MM-DD HH:mm');
            rules.value.push(newObj);
            antd.message.success('新规则已成功创建');
          }
          ruleModalOpen.value = false;
        }

        // 条件增删
        function addCondition() {
          editingRule.conditions.push({
            isOr: false,
            field: 1,
            fieldName: '业务类型',
            shouldBe: 10,
            operator: '属于',
            values: ['0'],
            valueText: '海运出口'
          });
        }

        function removeCondition(idx) {
          editingRule.conditions.splice(idx, 1);
        }

        function onConditionFieldChange(cond) {
          const found = conditionFieldOptions.find(f => f.value === cond.field);
          if (found) {
            cond.fieldName = found.label;
            if (found.kind === 'set') {
              cond.shouldBe = 10;
              cond.operator = '属于';
              cond.values = [];
              cond.valueText = '';
            } else if (found.kind === 'number') {
              cond.shouldBe = 8;
              cond.operator = '等于';
              cond.numberValue = 0;
            } else {
              cond.shouldBe = 0;
              cond.operator = '是';
            }
          }
        }

        function isSetField(fVal) {
          const f = conditionFieldOptions.find(item => item.value === fVal);
          return f ? f.kind === 'set' : false;
        }

        function isNumberField(fVal) {
          const f = conditionFieldOptions.find(item => item.value === fVal);
          return f ? f.kind === 'number' : false;
        }

        function getShouldBeOptions(fVal) {
          const f = conditionFieldOptions.find(item => item.value === fVal);
          if (!f) return [];
          if (f.kind === 'set') return [{ label: '属于', value: 10 }, { label: '不属于', value: 11 }];
          if (f.kind === 'number') return [
            { label: '等于', value: 8 },
            { label: '不等于', value: 9 },
            { label: '大于', value: 6 },
            { label: '大于等于', value: 7 },
            { label: '小于', value: 4 },
            { label: '小于等于', value: 5 }
          ];
          return [{ label: '是', value: 0 }, { label: '不是', value: 1 }];
        }

        function getEnumOptions(fVal) {
          if (fVal === 1) { // 业务类型
            return [
              { label: '海运出口 (0)', value: '0' },
              { label: '海运进口 (1)', value: '1' },
              { label: '空运出口 (2)', value: '2' },
              { label: '件杂货 (3)', value: '3' },
              { label: '空运进口 (4)', value: '4' }
            ];
          }
          if (fVal === 4) { // 客户性质
            return [{ label: '同行', value: '0' }, { label: '直客', value: '1' }];
          }
          if (fVal === 5) { // 结算方式
            return [{ label: '票结', value: '0' }, { label: '月结', value: '1' }, { label: '约定天数', value: '2' }];

          return [
            { label: '测试WF346验收客户', value: 'c-1' },
            { label: '青岛瑟琳国际物流有限公司', value: 'c-2' },
            { label: 'MSK (马士基)', value: 'c-3' },
            { label: 'COSCO (中远海运)', value: 'c-4' }
          ];
        }

          trialLoading.value = true;
          setTimeout(() => {
            trialLoading.value = false;

                { ticketNo: 'WF346-SI-SEP', bizType: '海运进口', willLock: true, reason: '-', note: '符合锁账规则要求' },

        // 执行明细
        function openRunDetail(run) {
          currentRunDetail.value = run;
          runDetailOpen.value = true;
        }

        function openSelectedRunDetail() {
          const found = runRecords.value.find(r => r.id === selectedRunKeys.value[0]);
          if (found) openRunDetail(found);
        }

        function searchRuns() {
          selectedRunKeys.value = [];
        }

        function resetRunFilter() {
          runFilter.ruleId = undefined;
          runFilter.triggerType = '';
          runFilter.dateRange = [];
          selectedRunKeys.value = [];
        }

        return {
          activeTab,
          rules,
          enabledRulesCount,
          ruleColumns,
          selectedRuleKeys,
          canRunSelectedNow,
          runningNow,
          ruleModalOpen,
          editingRule,
          companyOptions,
          userOptions,
          conditionFieldOptions,
          themeConfig,
          formatCompanies,
          formatScheduleText,
          toggleRuleEnable,
          openCreateModal,
          editSelectedRule,
          confirmRunNowSelected,
          viewSelectedRuns,
          deleteSelectedRules,
          saveRule,
          addCondition,
          removeCondition,
          onConditionFieldChange,
          isSetField,
          isNumberField,
          getShouldBeOptions,
          getEnumOptions,
          trialCompanyId,
          trialPeriod,
          trialLoading,
          trialResult,
          trialColumns,
          executeTrial,
          runRecords,
          filteredRuns,
          runFilter,
          ruleSelectOptions,
          runColumns,
          selectedRunKeys,
          runDetailOpen,
          currentRunDetail,
          runItemColumns,
          closeResultTagColor,
          openRunDetail,
          openSelectedRunDetail,
          searchRuns,
          resetRunFilter,
          onRuleSelectionChange,
          customRuleRow,
          onRunSelectionChange,
          customRunRow
        };
      }
    });

    app.use(antd);
    app.mount('#app');
  </script>
